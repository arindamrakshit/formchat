<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test website</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;line-height:1.6}</style></head>
<body>
<h1>Acme Test Website</h1>
<p>This page simulates a customer site. Open it as <code>/test.html?form=YOUR_SLUG</code>. To test truly cross-site, save this file locally and add <code>&amp;origin=http://localhost:3000</code>.</p>
<p>The chat bubble should appear bottom-right.</p>
<script>
  var p = new URLSearchParams(location.search), s = document.createElement("script");
  s.src = (p.get("origin") || location.origin) + "/widget.js";
  s.setAttribute("data-form", p.get("form") || "");
  document.body.appendChild(s);
</script>
</body></html>
